key: ghost
name: Ghost Publishing Connector
version: 1.0.0
tier: core
auth:
  type: admin_api_jwt
  fields:
    - admin_api_key
surfaces:
  - post
  - page
content_types:
  - html
  - markdown
format_limits:
  title_min_chars: 1
  title_max_chars: 255
  body_min_chars: 10
  body_max_chars: 500000
  max_tags: 15
  max_media_bytes: 50000000
rate_limits:
  requests_per_minute: 60
  burst: 10
capabilities:
  publish: true
  delete: true
  get_status: true
  fetch_metrics: true
  refresh_auth: false
  build_assist_pack: false
instance_param:
  description: "Ghost publication authors, tags, and custom excerpt"
  fields:
    custom_excerpt:
      type: string
      required: false
    featured:
      type: boolean
      required: false
error_map:
  401: CONNECTION_AUTH_EXPIRED
  403: CONNECTION_AUTH_EXPIRED
  422: PLATFORM_CONTENT_REJECTED
  429: PLATFORM_RATE_LIMIT
  500: PLATFORM_UNAVAILABLE
tailoring:
  framing: article_canonical
  closing_question: false
  attach_canonical_url: true
  tag_style: slug
  default_language: en
