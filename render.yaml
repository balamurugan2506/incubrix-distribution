services:
  - type: web
    name: incubrix-distribution-network
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: SIMULATION_MODE
        value: "true"
      - key: APP_ENV
        value: production
      - key: STORAGE_BACKEND
        value: local
      - key: DEMO_API_TOKEN
        generateValue: true
      - key: DEMO_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: CORS_ORIGINS
        value: "https://incubrix-distribution-network.onrender.com,http://localhost:8000,http://127.0.0.1:8000"
      # Database Configuration:
      # Render Free tier provides ephemeral container storage without persistent disks.
      # Setting DATABASE_URL to /tmp/incubrix.db ensures the unprivileged non-root 'incubrix'
      # user has full write permissions to create and manage the SQLite database and WAL logs.
      # NOTE: Database contents are ephemeral and will reset upon restart or redeployment.
      # To enable durable persistence on a paid Render plan:
      # 1. Attach a Persistent Disk (e.g. name: incubrix-data, mountPath: /app/data, sizeGB: 1)
      # 2. Update DATABASE_URL to: "sqlite+aiosqlite:////app/data/incubrix.db"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:////tmp/incubrix.db"
      - key: SYNC_DATABASE_URL
        value: "sqlite:////tmp/incubrix.db"
