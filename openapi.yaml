openapi: 3.1.0
info:
  title: IncuBrix Distribution Network API
  description: Production-grade long-tail destination network for multichannel content
    distribution.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ready:
    get:
      tags:
      - Health
      summary: Readiness Check
      operationId: readiness_check_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /connector/v1/{connector_key}/validate:
    post:
      tags:
      - Connector Contract
      summary: Validate Post
      operationId: validate_post_connector_v1__connector_key__validate_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/publish:
    post:
      tags:
      - Connector Contract
      summary: Publish Post
      operationId: publish_post_connector_v1__connector_key__publish_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/get_status:
    post:
      tags:
      - Connector Contract
      summary: Get Status Post
      operationId: get_status_post_connector_v1__connector_key__get_status_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/delete:
    post:
      tags:
      - Connector Contract
      summary: Delete Post
      operationId: delete_post_connector_v1__connector_key__delete_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/fetch_metrics:
    post:
      tags:
      - Connector Contract
      summary: Fetch Metrics Post
      operationId: fetch_metrics_post_connector_v1__connector_key__fetch_metrics_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchMetricsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/refresh_auth:
    post:
      tags:
      - Connector Contract
      summary: Refresh Auth Post
      operationId: refresh_auth_post_connector_v1__connector_key__refresh_auth_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshAuthRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshAuthResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/build_assist_pack:
    post:
      tags:
      - Connector Contract
      summary: Build Assist Pack Post
      operationId: build_assist_pack_post_connector_v1__connector_key__build_assist_pack_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildAssistPackRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistPackResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/manifests:
    get:
      tags:
      - Connector Contract
      summary: List Manifests
      operationId: list_manifests_connector_v1_manifests_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /connector/v1/{connector_key}/manifest:
    get:
      tags:
      - Connector Contract
      summary: Get Manifest
      operationId: get_manifest_connector_v1__connector_key__manifest_get
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations:
    get:
      tags:
      - Destination Catalogue
      summary: List Destinations
      operationId: list_destinations_api_v1_destinations_get
      parameters:
      - name: platform_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Platform Key
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: enabled
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DestinationResponse'
                title: Response List Destinations Api V1 Destinations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Destination Catalogue
      summary: Create Destination
      operationId: create_destination_api_v1_destinations_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations/{destination_id}:
    get:
      tags:
      - Destination Catalogue
      summary: Get Destination
      operationId: get_destination_api_v1_destinations__destination_id__get
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Destination Catalogue
      summary: Update Destination
      operationId: update_destination_api_v1_destinations__destination_id__put
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Destination Catalogue
      summary: Delete Destination
      operationId: delete_destination_api_v1_destinations__destination_id__delete
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations/import-csv:
    post:
      tags:
      - Destination Catalogue
      summary: Import Csv
      operationId: import_csv_api_v1_destinations_import_csv_post
      parameters:
      - name: check_reachability
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Check Reachability
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_import_csv_api_v1_destinations_import_csv_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSVImportSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations/import-csv-job:
    post:
      tags:
      - Destination Catalogue
      summary: Submit Csv Import Job
      description: Submits CSV catalogue import as an asynchronous background job
        returning 202 Accepted and job_id.
      operationId: submit_csv_import_job_api_v1_destinations_import_csv_job_post
      parameters:
      - name: check_reachability
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Check Reachability
      - name: callback_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_submit_csv_import_job_api_v1_destinations_import_csv_job_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs:
    post:
      tags:
      - Background Jobs
      summary: Submit Job
      description: Submit a long-running publication job. Returns HTTP 202 Accepted
        and job_id.
      operationId: submit_job_api_v1_jobs_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSubmitRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - Background Jobs
      summary: Get Job Status
      description: Retrieve job progress (0-100), execution state, and live published
        links.
      operationId: get_job_status_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/certification/jobs:
    post:
      tags:
      - Certification Harness
      summary: Submit Certification Job
      description: Submits a long-running certification run as an asynchronous background
        job returning 202 Accepted and job_id.
      operationId: submit_certification_job_api_v1_certification_jobs_post
      parameters:
      - name: callback_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationRunRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/certification/run:
    post:
      tags:
      - Certification Harness
      summary: Run Certification
      description: Executes the full 7-step certification harness for a destination.
      operationId: run_certification_api_v1_certification_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationReport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/certification/evidence/{destination_id}:
    get:
      tags:
      - Certification Harness
      summary: List Certification Evidence
      description: Retrieve historical certification receipts and evidence records
        for a destination.
      operationId: list_certification_evidence_api_v1_certification_evidence__destination_id__get
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/certification/receipt/{certification_id}:
    get:
      tags:
      - Certification Harness
      summary: Get Certification Receipt
      description: Fetch raw evidence envelope for a specific certification run.
      operationId: get_certification_receipt_api_v1_certification_receipt__certification_id__get
      parameters:
      - name: certification_id
        in: path
        required: true
        schema:
          type: string
          title: Certification Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/evidence/{evidence_id}:
    get:
      tags:
      - Evidence & Artifacts
      summary: Get Evidence Document
      description: 'Retrieve stored evidence documents (certification reports, assist
        packs, import audits)

        as downloadable artifacts.'
      operationId: get_evidence_document_api_v1_evidence__evidence_id__get
      parameters:
      - name: evidence_id
        in: path
        required: true
        schema:
          type: string
          title: Evidence Id
      - name: format
        in: query
        required: false
        schema:
          type: string
          pattern: ^(json|txt)$
          default: json
          title: Format
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AssistPackResult:
      properties:
        files:
          items:
            type: string
          type: array
          title: Files
        caption:
          type: string
          title: Caption
        deep_link:
          type: string
          title: Deep Link
        checklist:
          items:
            type: string
          type: array
          title: Checklist
      type: object
      required:
      - caption
      - deep_link
      title: AssistPackResult
    Body_import_csv_api_v1_destinations_import_csv_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_import_csv_api_v1_destinations_import_csv_post
    Body_submit_csv_import_job_api_v1_destinations_import_csv_job_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_submit_csv_import_job_api_v1_destinations_import_csv_job_post
    BuildAssistPackRequest:
      properties:
        rendition:
          $ref: '#/components/schemas/RenditionSchema'
        destination:
          $ref: '#/components/schemas/DestinationSchema'
      type: object
      required:
      - rendition
      - destination
      title: BuildAssistPackRequest
    CSVImportRowResult:
      properties:
        row_number:
          type: integer
          title: Row Number
        name:
          type: string
          title: Name
        url:
          type: string
          title: Url
        status:
          type: string
          title: Status
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      required:
      - row_number
      - name
      - url
      - status
      title: CSVImportRowResult
    CSVImportSummary:
      properties:
        total_rows:
          type: integer
          title: Total Rows
        imported_count:
          type: integer
          title: Imported Count
        skipped_duplicates:
          type: integer
          title: Skipped Duplicates
        errors_count:
          type: integer
          title: Errors Count
        rows:
          items:
            $ref: '#/components/schemas/CSVImportRowResult'
          type: array
          title: Rows
      type: object
      required:
      - total_rows
      - imported_count
      - skipped_duplicates
      - errors_count
      title: CSVImportSummary
    CertificationReport:
      properties:
        certification_id:
          type: string
          title: Certification Id
        destination_id:
          type: string
          title: Destination Id
        destination_name:
          type: string
          title: Destination Name
        connector_key:
          type: string
          title: Connector Key
        connector_version:
          type: string
          title: Connector Version
        environment:
          type: string
          title: Environment
        verdict:
          type: string
          title: Verdict
          default: inconclusive
        passed:
          type: boolean
          title: Passed
          default: false
        platform_post_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Platform Post Id
        live_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Live Url
        deletion_confirmed:
          type: boolean
          title: Deletion Confirmed
          default: false
        evidence_file:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence File
        started_at:
          type: string
          title: Started At
        completed_at:
          type: string
          title: Completed At
          default: ''
        steps:
          items:
            $ref: '#/components/schemas/CertificationStepReceipt'
          type: array
          title: Steps
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
      type: object
      required:
      - certification_id
      - destination_id
      - destination_name
      - connector_key
      - connector_version
      - environment
      - started_at
      title: CertificationReport
    CertificationRunRequest:
      properties:
        destination_id:
          type: string
          title: Destination Id
          description: Destination ID to certify
        connection:
          anyOf:
          - $ref: '#/components/schemas/ConnectionSchema'
          - type: 'null'
        environment:
          type: string
          title: Environment
          description: '''mock'' for local simulation, ''production'' for real platform'
          default: mock
      type: object
      required:
      - destination_id
      title: CertificationRunRequest
    CertificationStepReceipt:
      properties:
        step:
          type: string
          title: Step
        status:
          type: string
          title: Status
        timestamp:
          type: string
          title: Timestamp
        details:
          additionalProperties: true
          type: object
          title: Details
      type: object
      required:
      - step
      - status
      - timestamp
      title: CertificationStepReceipt
    ConnectionSchema:
      properties:
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
          description: Base API endpoint if configurable per instance
        credentials:
          additionalProperties: true
          type: object
          title: Credentials
          description: Credentials (api_key, token, secret, username)
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
          description: ISO timestamp of token expiry
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Additional connection state
      type: object
      title: ConnectionSchema
    DeleteRequest:
      properties:
        platform_post_id:
          type: string
          title: Platform Post Id
          description: External platform post ID
        connection:
          $ref: '#/components/schemas/ConnectionSchema'
      type: object
      required:
      - platform_post_id
      - connection
      title: DeleteRequest
    DeleteResult:
      properties:
        deleted:
          type: boolean
          title: Deleted
      type: object
      required:
      - deleted
      title: DeleteResult
    DestinationCreate:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 2
          title: Name
        url:
          type: string
          maxLength: 512
          minLength: 4
          title: Url
        platform_key:
          type: string
          maxLength: 64
          minLength: 2
          title: Platform Key
        connector_key:
          type: string
          maxLength: 64
          minLength: 2
          title: Connector Key
        surface:
          type: string
          maxLength: 64
          title: Surface
          default: main
        category:
          type: string
          maxLength: 128
          title: Category
          default: general
        audience_tags:
          items:
            type: string
          type: array
          title: Audience Tags
        language:
          type: string
          maxLength: 16
          title: Language
          default: en
        geo:
